[network]
name = "example-mesh"
cidr = "10.42.0.0/24"
config_dir = "/etc/aegis-net"
listen_port = 51820
mtu = 1300
interface = "aegis0"

[peers.lighthouse]
ip = "10.42.0.1"
groups = ["servers"]
endpoint = "203.0.113.1:51820"
lighthouse = true
cert_duration = "365d"

[peers.alice-laptop]
ip = "10.42.0.2"
groups = [
    "admin",
    "dev",
]
lighthouse = false
cert_duration = "365d"

[peers.bob-workstation]
ip = "10.42.0.3"
groups = [
    "admin",
    "dev",
]
lighthouse = false
cert_duration = "365d"

[peers.app-server]
ip = "10.42.0.10"
groups = ["servers"]
endpoint = "203.0.113.10:51820"
lighthouse = false
cert_duration = "365d"

[firewall]
default_action = "deny"

# Admin group gets full access to everything
[[firewall.inbound]]
port = "any"
groups = ["admin"]
action = "allow"

# Servers can talk to each other on service ports
[[firewall.inbound]]
port = "3000-9000"
proto = "tcp"
groups = ["servers"]
action = "allow"

# Allow all outbound from mesh
[[firewall.outbound]]
port = "any"
groups = ["admin", "servers"]
action = "allow"
