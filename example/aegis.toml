[aegis]
version = "0.1.0"
description = "Development environment configuration"
default_profile = "dev-vps"
strategy = "symlink"

[variables]
hostname = { source = "command", value = "hostname" }
user = { source = "env", value = "USER" }
nvidia_api_key = { source = "env", value = "NVIDIA_API_KEY" }

# Service configuration variables
gateway_url = { source = "static", value = "http://localhost:9000" }
gateway_secret = { source = "env", value = "GATEWAY_SECRET" }
worker_queue_url = { source = "static", value = "redis://localhost:6379" }
worker_concurrency = { source = "static", value = "4" }

[profiles.dev-vps]
description = "Development server with full tooling"
modules = ["shell", "terminal", "dev-tools", "ai-tools", "my-platform", "my-services", "container-services"]
variables = { gpu_available = "false" }

[profiles.workstation]
description = "Local workstation with GPU"
modules = ["shell", "terminal", "dev-tools", "ai-tools", "my-platform"]
variables = { gpu_available = "true" }

[profiles.ci]
description = "Minimal CI environment"
modules = ["shell", "dev-tools"]

[[modules]]
name = "shell"
path = "modules/shell"

[[modules]]
name = "terminal"
path = "modules/terminal"

[[modules]]
name = "ai-tools"
path = "modules/ai-tools"

[[modules]]
name = "dev-tools"
path = "modules/dev-tools"

[[modules]]
name = "my-platform"
path = "modules/my-platform"

[[modules]]
name = "my-services"
path = "modules/my-services"

[[modules]]
name = "container-services"
path = "modules/container-services"
